name: Pack BG Dump (rename + zip)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза с ассетами'
        required: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dump/webm dump/mp4 dump/posters
          gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" \
            --pattern '*.webm' --dir dump/webm
          gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" \
            --pattern '*.mp4' --dir dump/mp4
          gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" \
            --pattern '*.webp' --dir dump/posters

      - name: Rename posters to pNN_img-main mask
        shell: bash
        run: |
          cd dump/posters
          for f in p*_video.webp; do
            [ -e "$f" ] || continue
            mv "$f" "${f%_video.webp}_img-main.webp"
          done
          ls

      - name: Add README + zip (store)
        shell: bash
        run: |
          cd dump
          cat > DUMP_README.md << 'MD'
          # CTA — фоновые видео-паттерны (дамп кодирования, ${{ inputs.release_tag }})

          31 паттерн, аудио вырезано у всех.
          - webm/pNN_video.webm — VP9 Profile 2, 10-bit, 2-pass CRF 30, cues front (анти-бандинг)
          - mp4/pNN_video.mp4 — H.264 High 8-bit, CRF 18, +faststart (фолбэк)
          - posters/pNN_img-main.webp — первый кадр, libwebp q82, для poster/LQIP

          <video autoplay muted loop playsinline preload="none" poster=".../pNN_img-main.webp">
            <source src=".../pNN_video.webm" type='video/webm; codecs="vp09.02.10.10"'>
            <source src=".../pNN_video.mp4" type="video/mp4">
          </video>
          MD
          zip -0 -r -q "../cta-bg-patterns-dump-$(date +%Y%m%d).zip" DUMP_README.md webm mp4 posters
          ls -lh ../cta-bg-patterns-dump-*.zip

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" cta-bg-patterns-dump-*.zip --clobber -R "${{ github.repository }}"
