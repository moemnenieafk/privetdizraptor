# Разведка: открыт ли статик-индекс players.tarkov.dev (для варианта B — свой поиск).
# Запуск: Actions → «probe-players-index» → Run workflow. Ничего не меняет, только читает.
name: probe-players-index

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe players.tarkov.dev index
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Задай Variable PROD_BASE_URL и Secret CRON_SECRET"
            exit 1
          fi
          url="${BASE_URL%/}/api/eft/players-index-probe"
          echo "GET $url"
          code=$(curl -sS -m 120 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "HTTP $code"
          cat /tmp/out.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Проба не удалась (HTTP $code)"
            exit 1
          fi
