# Ежечасно обновляет цены EFT: дёргает наш self-mirror эндпоинт, который тянет
# свежие данные из tarkov.dev в Supabase. Бесплатная замена Vercel Cron (на Hobby
# тот только раз в сутки). Расписание GitHub — best-effort (возможна задержка
# 5–15 мин), для цен это ок.
#
# Нужны в настройках репозитория (Settings → Secrets and variables → Actions):
#   • Secret   CRON_SECRET    — то же значение, что в Vercel env
#   • Variable PROD_BASE_URL  — прод-домен, напр. https://cta.vercel.app (без /api)
name: sync-prices

on:
  workflow_dispatch: {} # + ручной запуск из вкладки Actions

# Чтобы параллельные/наслаивающиеся запуски не толкались
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger price sync
        env:
          BASE_URL: ${{ vars.PROD_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Задай Variable PROD_BASE_URL и Secret CRON_SECRET в Settings → Secrets and variables → Actions"
            exit 1
          fi
          url="${BASE_URL%/}/api/cron/sync-prices"
          echo "POST $url"
          code=$(curl -sS -m 180 -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "HTTP $code"
          cat /tmp/out.json 2>/dev/null || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Синк цен не удался (HTTP $code)"
            exit 1
          fi
