name: Encode BG Patterns

on:
  workflow_dispatch:
    inputs:
      drive_folder:
        description: 'Google Drive folder URL (public)'
        required: true
        default: 'https://drive.google.com/drive/folders/1WTelbUKd8qhAqDfRmW0ovjxAME06pavU'
      vp9_crf:
        description: 'VP9 CRF (30 = default, 28 = меньше бандинга)'
        required: false
        default: '30'
      max_height:
        description: 'Потолок разрешения'
        required: false
        default: '1440'

permissions:
  contents: write

concurrency:
  group: encode-bg
  cancel-in-progress: true

env:
  SHARDS: 8

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bg-patterns-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --title "BG patterns — encoded ($TAG)" \
            --notes "VP9 Profile 2 10-bit CRF ${{ inputs.vp9_crf }} (2-pass, cues front) + H.264 CRF 18 (faststart). Аудио вырезано. Заливается шардами — дождись завершения workflow."
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  encode:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: pip install "gdown>=5"

      - name: Download from Google Drive
        shell: bash
        run: |
          mkdir -p source
          FOLDER_ID="$(echo "${{ inputs.drive_folder }}" | grep -oE 'folders/[A-Za-z0-9_-]+' | cut -d/ -f2)"
          gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" -O source 2>&1 | tail -3
          find source -mindepth 2 -type f -exec mv -n {} source/ \;
          find source -mindepth 1 -type d -empty -delete || true
          [ -n "$(find source -maxdepth 1 -type f | head -1)" ]

      - name: Keep only this shard's files
        shell: bash
        run: |
          i=0
          for f in $(find source -maxdepth 1 -type f | sort); do
            if (( i % SHARDS != ${{ matrix.shard }} )); then rm -f "$f"; fi
            i=$((i+1))
          done
          echo "Шард ${{ matrix.shard }}:"; ls -la source

      - name: Encode shard
        shell: bash
        env:
          VP9_CRF: ${{ inputs.vp9_crf }}
          MAX_HEIGHT: ${{ inputs.max_height }}
        run: |
          chmod +x scripts/encode-bg-patterns.sh
          ./scripts/encode-bg-patterns.sh source out 2>&1 | tee "shard-${{ matrix.shard }}.log"

      - name: Upload shard results to release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          FILES=(out/webm/*.webm out/mp4/*.mp4 shard-${{ matrix.shard }}.log)
          gh release upload "${{ needs.prepare.outputs.tag }}" "${FILES[@]}" --clobber
