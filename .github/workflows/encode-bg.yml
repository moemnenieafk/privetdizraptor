name: Encode BG Patterns

on:
  workflow_dispatch:
    inputs:
      drive_folder:
        description: 'Google Drive folder URL (public)'
        required: true
        default: 'https://drive.google.com/drive/folders/1WTelbUKd8qhAqDfRmW0ovjxAME06pavU'
      vp9_crf:
        description: 'VP9 CRF (30 = default, 28 = меньше бандинга)'
        required: false
        default: '30'
      max_height:
        description: 'Потолок разрешения'
        required: false
        default: '1440'

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install gdown
        run: pip install "gdown>=5.2"

      - name: Download from Google Drive
        run: |
          set -x
          mkdir -p source
          FOLDER_URL="${{ inputs.drive_folder }}"
          FOLDER_ID="$(echo "$FOLDER_URL" | grep -oE 'folders/[A-Za-z0-9_-]+' | cut -d/ -f2)"
          echo "Folder ID: $FOLDER_ID"

          {
            # Попытка 1: gdown --folder
            if ! gdown --folder "https://drive.google.com/drive/folders/$FOLDER_ID" -O source --remaining-ok; then
              echo "=== gdown --folder failed, fallback: embeddedfolderview ==="
              curl -sL "https://drive.google.com/embeddedfolderview?id=$FOLDER_ID#list" -o /tmp/folder.html
              grep -oE 'data-id="[A-Za-z0-9_-]+"' /tmp/folder.html | cut -d'"' -f2 | sort -u > /tmp/ids.txt
              echo "Found $(wc -l < /tmp/ids.txt) file IDs"
              cat /tmp/ids.txt
              cd source
              while read -r ID; do
                gdown "$ID" || echo "FAILED: $ID"
              done < /tmp/ids.txt
              cd ..
            fi
          } 2>&1 | tee /tmp/download.log

          find source -mindepth 2 -type f -exec mv -n {} source/ \;
          find source -mindepth 1 -type d -empty -delete || true
          echo "── Скачано ──" | tee -a /tmp/download.log
          ls -la source | tee -a /tmp/download.log
          du -sh source | tee -a /tmp/download.log
          # если пусто — валимся
          [ -n "$(find source -maxdepth 1 -type f | head -1)" ]

      - name: FFmpeg version
        run: ffmpeg -version | head -1

      - name: Encode all patterns
        env:
          VP9_CRF: ${{ inputs.vp9_crf }}
          MAX_HEIGHT: ${{ inputs.max_height }}
        run: |
          chmod +x scripts/encode-bg-patterns.sh
          ./scripts/encode-bg-patterns.sh source out 2>&1 | tee /tmp/encode.log

      - name: Publish release with encoded files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bg-patterns-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            --title "BG patterns — encoded ($TAG)" \
            --notes "VP9 Profile 2 10-bit CRF ${{ inputs.vp9_crf }} (2-pass, cues front) + H.264 CRF 18 (faststart). Аудио вырезано." \
            out/webm/*.webm out/mp4/*.mp4 /tmp/encode.log

      - name: Publish debug log (always)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch /tmp/download.log
          cp /tmp/download.log "debug-run-${{ github.run_id }}.log"
          gh release delete debug-log --yes 2>/dev/null || true
          git push --delete origin debug-log 2>/dev/null || true
          gh release create debug-log \
            --title "debug: последний лог скачивания" \
            --notes "run ${{ github.run_id }}" \
            "debug-run-${{ github.run_id }}.log"
