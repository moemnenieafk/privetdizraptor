# Ручной синк оружейного слоя (weapon_bases/slots/parts/presets).
# Запуск с телефона: GitHub → Actions → «Синк оружия (EFT)» → Run workflow.
#
# Расписания НЕТ намеренно: слоты и модификаторы меняются раз в патч игры,
# а не раз в час (в отличие от цен). Гоняем руками после патча.
#
# Секрет не светится в URL: заголовок Bearer ставит curl, не браузер.
name: Синк оружия (EFT)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Дёрнуть /api/cron/sync-weapons
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::нет SITE_URL или CRON_SECRET в secrets репозитория"
            exit 1
          fi

          echo "→ POST $SITE_URL/api/cron/sync-weapons"

          # Синк тяжёлый (полный дамп + перезапись таблиц) — даём 5 минут.
          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/sync-weapons")

          echo "HTTP $http_code"
          cat response.json
          echo ""

          if [ "$http_code" != "200" ]; then
            echo "::error::синк упал — таблицы НЕ тронуты (транзакция откатилась)"
            exit 1
          fi

      - name: Показать итог
        if: success()
        run: |
          echo "### Синк оружия" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat response.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
