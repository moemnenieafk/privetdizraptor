name: Commit log → CHANGELOG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    # не зациклиться на собственном коммите бота
    if: ${{ !contains(github.event.head_commit.message, '[skip changelog]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate auto commit-log section
        run: |
          python3 - <<'PY'
          import subprocess, re
          SINCE = "2026-06-23"
          log = subprocess.check_output(
              ["git", "log", f"--since={SINCE} 00:00:00", "--date=short",
               "--pretty=format:%ad%x09%h%x09%s"], text=True
          ).splitlines()
          out, cur = [], None
          for line in log:
              d, h, s = line.split("\t", 2)
              if d != cur:
                  out.append(f"\n### {d}"); cur = d
              out.append(f"- `{h}` {s}")
          body = "\n".join(out).strip()
          section = ("<!-- AUTO-COMMIT-LOG:START -->\n\n"
                     f"## 🧾 Лог коммитов (авто, с {SINCE})\n\n"
                     "> Автогенерируется `.github/workflows/changelog.yml` на каждый push в `main`. "
                     "Руками не редактировать — правки затрутся. Курируемая история (Keep a Changelog) — выше.\n\n"
                     f"{body}\n\n<!-- AUTO-COMMIT-LOG:END -->")
          cl = open("CHANGELOG.md", encoding="utf-8").read()
          if "AUTO-COMMIT-LOG:START" in cl:
              cl = re.sub(r"<!-- AUTO-COMMIT-LOG:START -->.*?<!-- AUTO-COMMIT-LOG:END -->",
                          lambda m: section, cl, flags=re.S)
          else:
              cl = cl.rstrip() + "\n\n---\n\n" + section + "\n"
          open("CHANGELOG.md", "w", encoding="utf-8").write(cl)
          PY

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): sync commit log [skip changelog]"
          git push
